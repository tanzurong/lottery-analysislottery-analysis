<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双色球娱乐分析工作台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='26' cy='38' r='20' fill='%23E5484D'/%3E%3Ccircle cx='40' cy='22' r='14' fill='%233E8BFF'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap">
<style>
:root{
  --bg:#0B1626; --bg2:#0D1B2D; --panel:#12263D; --panel2:#172F4B; --line:#1E3A5F;
  --txt:#E6EEF7; --txt2:#93A7C0; --txt3:#5F7796;
  --red:#E5484D; --red-d:#B93236; --blue:#3E8BFF; --blue-d:#2A66C2;
  --amber:#F0A94A; --green:#34C26B; --danger:#E5484D;
  --font-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --font-mono:"SF Mono","Cascadia Code",Consolas,"Courier New",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--font-sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:rgba(62,139,255,.35)}
.app{display:flex;min-height:100vh}
.side{width:224px;flex:0 0 224px;background:var(--bg2);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:4px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:12px}
.brand .logo{width:36px;height:36px;flex:0 0 36px}
.brand b{font-size:16px;font-weight:900;letter-spacing:.5px}
.brand small{display:block;color:var(--txt3);font-size:11px;font-weight:400}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--txt2);cursor:pointer;text-decoration:none;font-weight:500;transition:background .15s,color .15s}
.nav-item svg{width:18px;height:18px;flex:0 0 18px;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.nav-item.active{background:linear-gradient(90deg,rgba(229,72,77,.16),rgba(62,139,255,.16));color:var(--txt);box-shadow:inset 3px 0 0 var(--red)}
.main{flex:1;min-width:0;padding:28px 34px 60px}
.view{display:none}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.banner{display:flex;gap:10px;align-items:flex-start;background:rgba(240,169,74,.1);border:1px solid rgba(240,169,74,.35);color:#F7C87E;padding:12px 16px;border-radius:12px;margin-bottom:22px;font-size:13px;line-height:1.7}
.banner svg{width:18px;height:18px;flex:0 0 18px;margin-top:2px}
.mode-tag{display:inline-flex;align-items:center;gap:6px;margin-left:12px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.mode-tag.online{background:rgba(52,194,107,.14);border:1px solid rgba(52,194,107,.4);color:#7FE0A8}
.mode-tag.offline{background:rgba(240,169,74,.12);border:1px solid rgba(240,169,74,.35);color:#F7C87E}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:900;letter-spacing:.5px}
.page-head p{color:var(--txt2);font-size:13px;margin-top:4px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--txt2);padding:7px 16px;border-radius:8px;cursor:pointer;font-family:var(--font-sans);font-size:13px;font-weight:500;transition:all .15s}
.seg button.active{background:var(--panel2);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.grid{display:grid;gap:16px}
.g-stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:16px}
.g-2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.panel h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 8px}
.panel h3 .dot.blue{background:var(--blue)}
.panel h3 .dot.amber{background:var(--amber)}
.panel h3 .dot.green{background:var(--green)}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.stat-card .label{color:var(--txt2);font-size:12px}
.stat-card .value{font-size:28px;font-weight:900;font-family:var(--font-mono);margin-top:6px;letter-spacing:.5px}
.stat-card .sub{color:var(--txt3);font-size:12px;margin-top:4px}
.balls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ball{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:16px;color:#fff;flex:0 0 38px}
.ball.red{background:radial-gradient(circle at 32% 30%,#FF7B7E,var(--red) 55%,var(--red-d));box-shadow:0 3px 10px rgba(229,72,77,.35)}
.ball.blue{background:radial-gradient(circle at 32% 30%,#6FB2FF,var(--blue) 55%,var(--blue-d));box-shadow:0 3px 10px rgba(62,139,255,.35)}
.ball.sm{width:30px;height:30px;font-size:13px;flex-basis:30px}
.mini-ball{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:11px;font-weight:700;color:#fff;margin-right:4px}
.mini-ball.red{background:var(--red)}
.mini-ball.blue{background:var(--blue)}
.mini-ball.gray{background:#3E5A7D}
.btn{border:0;border-radius:10px;padding:9px 18px;font-family:var(--font-sans);font-size:14px;font-weight:700;cursor:pointer;transition:filter .15s,transform .05s;color:#fff}
.btn:active{transform:scale(.98)}
.btn.red{background:linear-gradient(135deg,var(--red),var(--red-d))}
.btn.blue{background:linear-gradient(135deg,var(--blue),var(--blue-d))}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt2)}
.btn.ghost:hover{color:var(--txt)}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.mini{padding:6px 12px;font-size:12.5px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
textarea.imp{width:100%;min-height:150px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--txt);font-family:var(--font-mono);font-size:12.5px;padding:12px;resize:vertical;line-height:1.7}
textarea.imp:focus{outline:none;border-color:var(--blue)}
table.list{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}
table.list th{color:var(--txt3);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:12px}
table.list td{padding:8px 10px;border-bottom:1px solid rgba(30,58,95,.55);font-family:var(--font-mono)}
table.list tr:hover td{background:rgba(62,139,255,.05)}
.tbl-wrap{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:10px}
.tbl-wrap::-webkit-scrollbar{width:8px;height:8px}
.tbl-wrap::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.pill{display:inline-flex;align-items:center;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill.hot{background:rgba(229,72,77,.16);color:#FF8B8E;border:1px solid rgba(229,72,77,.4)}
.pill.cold{background:rgba(62,139,255,.14);color:#7FB8FF;border:1px solid rgba(62,139,255,.4)}
.pill.warm{background:rgba(240,169,74,.13);color:#F7C87E;border:1px solid rgba(240,169,74,.35)}
.pill.green{background:rgba(52,194,107,.13);border:1px solid rgba(52,194,107,.4);color:#7FE0A8}
.pill.gray{background:rgba(95,119,150,.15);border:1px solid rgba(95,119,150,.4);color:#93A7C0}
.pill.lv1{background:rgba(229,72,77,.2);border:1px solid var(--red);color:#FF9B9E}
.chart-box{height:320px;width:100%}
.chart-box.tall{height:360px}
.chart-box.short{height:240px}
.freq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.freq-cell{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 4px;text-align:center;position:relative;overflow:hidden}
.freq-cell .n{font-family:var(--font-mono);font-weight:700;font-size:15px}
.freq-cell .c{font-family:var(--font-mono);font-size:11px;color:var(--txt3)}
.freq-cell .bar-bg{position:absolute;left:0;bottom:0;height:3px;border-radius:0 0 8px 8px}
.pick-item{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:14px}
.pick-item .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;color:var(--txt3);font-size:12px;margin-top:10px}
.pick-item .meta b{color:var(--txt2);font-weight:600}
.strategy-card{cursor:pointer;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--panel);transition:border-color .15s,box-shadow .15s}
.strategy-card:hover{border-color:var(--line)}
.strategy-card.selected{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset,0 6px 18px rgba(62,139,255,.15)}
.strategy-card h4{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.strategy-card p{color:var(--txt2);font-size:12px;margin-top:6px;line-height:1.7}
.strategy-card .tag{margin-left:auto;font-size:11px;color:var(--txt3);font-family:var(--font-mono)}
.import-ok{color:var(--green);font-size:13px}
.import-err{color:#FF8B8E;font-size:13px}
.quick-links{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.quick-link{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-decoration:none;color:var(--txt);transition:transform .15s,border-color .15s}
.quick-link:hover{transform:translateY(-2px);border-color:var(--blue)}
.quick-link svg{width:20px;height:20px;color:var(--blue)}
.quick-link.red svg{color:var(--red)}
.muted{color:var(--txt3);font-size:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
code{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-family:var(--font-mono);font-size:12px;color:#AFC5E2}
/* 我的推荐 */
.check-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--panel)}
.check-row .hit{font-family:var(--font-mono);font-size:12px;color:var(--txt2)}
.check-row .prize{font-family:var(--font-mono);font-size:12px;font-weight:700}
@media (max-width:920px){
  .app{flex-direction:column}
  .side{width:100%;flex:0 0 auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px 12px;gap:6px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{display:none}
  .nav-item{flex:0 0 auto;padding:8px 12px;font-size:13px;min-height:44px;min-width:44px}
  .nav-item span{display:none}
  .nav-item.active{box-shadow:inset 0 -3px 0 var(--red)}
  .main{padding:20px 16px 48px}
  .grid.g-2{grid-template-columns:1fr}
  .chart-box{height:280px}
  .seg button{min-height:42px}
  .btn{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  body{font-size:15px}
  textarea.imp,input{font-size:16px}
}
@media (max-width:480px){
  .g-stats{grid-template-columns:repeat(2,1fr)}
  .page-head h1{font-size:20px}
  .ball{width:32px;height:32px;font-size:14px;flex-basis:32px}
  .ball.sm{width:26px;height:26px;font-size:11px;flex-basis:26px}
}

<script>
"use strict";
/* =====================================================
   全局工具
   ===================================================== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const RED_MAX = 33, BLUE_MAX = 16;
const STRATEGIES = {
  hot:{name:"热号加权", desc:"按窗口出现频次做权重（频次越高越易被选中），适合观察「近期活跃号」的分布模拟。"},
  cold:{name:"冷号加权", desc:"按当前遗漏值做权重（遗漏越久越易被选中），适合观察「长期未出号」的回补模拟。"},
  mix:{name:"均衡组合", desc:"热冷各半 + 奇偶 3:3 附近 + 大小均衡 + 和值 60–140 约束，模拟「机选套餐」风格。"},
  multi:{name:"多因子精选", desc:"热度0.35 + 遗漏回补0.25 + 近10期动量0.20 综合加权，并经和值/奇偶/大小/AC值四重过滤，比单一权重更有章法。"},
  pair:{name:"搭档精选", desc:"在多因子评分基础上，组合偏好历史共现提升度高的红球搭档对（详见统计页「热搭档」）。"},
  wheel:{name:"胆拖缩水", desc:"自己圈 8~12 个胆码 + 1 蓝，用覆盖设计生成最少注单，保证胆码中 5 红时至少一注中 5 红。"}
};
const PRIZE_TABLE = [
  [6,1,"一等奖",null],[6,0,"二等奖",null],[5,1,"三等奖",3000],[5,0,"四等奖",200],
  [4,1,"四等奖",200],[4,0,"五等奖",10],[3,1,"五等奖",10],[2,1,"六等奖",5],
  [1,1,"六等奖",5],[0,1,"六等奖",5]
];
let state = { view:"home", win:100, strategy:"hot", count:5, online:null };

/* =====================================================
   离线数据引擎（API 不可用时回退；逻辑与后端一致）
   ===================================================== */
const LS_DATA = "ssq_data_v1", LS_PICKS = "ssq_picks_v1";
const DEMO_RAW = [
"2025050|02 07 13 18 24 31|05","2025049|03 09 14 22 27 32|12","2025048|01 06 11 19 26 30|09",
"2025047|04 08 15 21 25 29|02","2025046|05 10 16 20 23 33|14","2025045|02 12 17 24 28 31|07",

"2025032|02 08 13 19 27 31|05","2025031|03 07 16 20 25 32|14","2025030|04 10 11 18 26 29|09",
"2025029|01 06 14 21 23 30|02","2025028|05 09 17 22 28 33|11","2025027|02 12 15 19 24 31|06",
"2025026|03 08 18 20 27 32|13","2025025|01 07 11 16 25 29|08","2025024|04 06 13 23 26 30|15",

"2024149|02 08 13 18 24 31|05","2024148|03 06 14 21 27 33|12","2024147|01 05 11 20 25 30|09",

"2024140|02 07 11 17 26 31|08"
];
function parseRaw(lines){
  const list = [];
  for(const line of lines){
    const t = line.replace(/^\s+|\s+$/g,"");
    if(!t || t.startsWith("#")) continue;
    const parts = t.split(/[|,;\t ]+/).filter(Boolean);
    if(parts.length < 8) continue;
    const nums = parts.slice(-7).map(Number);
    if(nums.some(n=>!Number.isInteger(n))) continue;
    const red = nums.slice(0,6).sort((a,b)=>a-b);
    const blue = nums[6];
    if(red.length!==6 || new Set(red).size!==6 || red.some(n=>n<1||n>33)) continue;
    if(blue<1||blue>16) continue;
    list.push({period:String(parts[0]), red, blue, demo:false});
  }
  list.sort((a,b)=>String(b.period).localeCompare(String(a.period)));
  return list;
}
function loadLocal(){ try{ const r=localStorage.getItem(LS_DATA); if(r) return JSON.parse(r); }catch(e){} return parseRaw(DEMO_RAW).map(r=>({...r,demo:true})); }
function saveLocal(list){ localStorage.setItem(LS_DATA, JSON.stringify(list)); }
function windowOf(list, n){ if(!n || n>=list.length) return list; return list.slice(0,n); }
function freqOf(list, max, blue){ const f=new Array(max+1).fill(0); for(const d of list){ if(blue) f[d.blue]++; else d.red.forEach(r=>f[r]++); } return f; }
function missOf(list, max, blue){ const m=new Array(max+1).fill(0); if(!list.length) return m; for(let i=1;i<=max;i++){ let f=list.findIndex(d=>blue?d.blue===i:d.red.includes(i)); m[i]=f===-1?list.length:f; } return m; }
const sumOf = d => d.red.reduce((a,b)=>a+b,0);
const oddCount = d => d.red.filter(n=>n%2===1).length;
const bigCount = d => d.red.filter(n=>n>=17).length;
function weightedPick(pool, w){ const t=w.reduce((a,b)=>a+b,0); if(t<=0) return null; let r=Math.random()*t; for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<0) return pool[i]; } return pool[pool.length-1]; }
function pickMany(weight,k){ const pool=[...Array(RED_MAX)].map((_,i)=>i+1); const w=[...Array(RED_MAX)].map((_,i)=>weight[i+1]); const out=[]; while(out.length<k&&pool.length){ const t=w.reduce((a,b)=>a+b,0); let r=Math.random()*t, idx=0; for(let i=0;i<pool.length;i++){ r-=w[i]; if(r<0){idx=i;break;} } if(idx>=pool.length) idx=pool.length-1; out.push(pool[idx]); pool.splice(idx,1); w.splice(idx,1);} return out; }
function pickMix(weight){ const red=[]; const all=[...Array(RED_MAX)].map((_,i)=>i+1); for(let k=0;k<6;k++){ let c=all.filter(n=>!red.includes(n)); if(k===5){ const o=red.filter(n=>n%2).length, b=red.filter(n=>n>=17).length; c=c.filter(n=>Math.abs((o+n%2)-3)<=1 && Math.abs((b+(n>=17))-3)<=1); } if(!c.length) return null; const p=weightedPick(c,c.map(n=>weight[n])); if(p==null) return null; red.push(p); } const s=red.reduce((a,b)=>a+b,0); return s<60||s>140?null:red; }
function localRecommend(list, win, strategy, count){
  const w=windowOf(list,win);
  const f=freqOf(w,RED_MAX), m=missOf(w,RED_MAX);
  const weight=[...Array(RED_MAX+1)].fill(1);
  if(strategy==="hot"){ for(let i=1;i<=RED_MAX;i++) weight[i]=Math.pow(f[i],1.4)+1; }
  if(strategy==="cold"){ for(let i=1;i<=RED_MAX;i++) weight[i]=m[i]+1; }
  if(strategy==="mix"){ const thHot=Math.max(2,Math.round(w.length*6/RED_MAX*1.6)); const thCold=Math.max(3,Math.round(w.length/2)); for(let i=1;i<=RED_MAX;i++){ if(f[i]>=thHot) weight[i]=4; else if(m[i]>=thCold) weight[i]=3; else weight[i]=1; } }
  const fb=freqOf(w,BLUE_MAX,true);
  const sets=[]; let guard=0;
  while(sets.length<count && guard++<count*80){
    let red = strategy==="mix" ? pickMix(weight) : pickMany(weight,6);
    if(!red || red.length<6) continue;
    red.sort((a,b)=>a-b);
    const blue=weightedPick([...Array(BLUE_MAX)].map((_,i)=>i+1),[...Array(BLUE_MAX)].map((_,i)=>fb[i+1]+1))||Math.floor(Math.random()*BLUE_MAX)+1;
    sets.push({red,blue});
  }
  return sets;
}
function localCheckOne(red, blue, dr, db){ const hit=red.filter(n=>dr.includes(n)).length; const bh=blue===db; for(const [r,b,lv,p] of PRIZE_TABLE){ if(hit===r&&bh===b) return {hit_red:hit,hit_blue:bh,level:lv,prize:p,won:true}; } return {hit_red:hit,hit_blue:bh,level:null,prize:0,won:false}; }
function localFindDrawAfter(list, base){ const cand=list.filter(r=>r.period>base); if(!cand.length) return null; return cand.reduce((a,b)=>a.period<b.period?a:b); }
</script>
<script>
"use strict";
/* =====================================================
   dataLayer：在线（后端 API）/ 离线（浏览器本地）双通道
   ===================================================== */
async function apiFetch(path, opts){
  const res = await fetch(path, opts);
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
function localId(){ return Date.now(); }
function loadPicksLocal(){ try{ return JSON.parse(localStorage.getItem(LS_PICKS))||[]; }catch(e){ return []; } }
function savePicksLocal(list){ localStorage.setItem(LS_PICKS, JSON.stringify(list)); }

const dataLayer = {
  async overview(win){
    if(state.online) return apiFetch(`/api/overview?win=${win}`);
    const list = loadLocal(), w = windowOf(list, win);
    const fR=freqOf(w,RED_MAX), fB=freqOf(w,BLUE_MAX,true), mR=missOf(w,RED_MAX), mB=missOf(w,BLUE_MAX,true);
    const sums=list.slice(0,20).map(sumOf);
    const hotR=fR.indexOf(Math.max(...fR.slice(1))), hotB=fB.indexOf(Math.max(...fB.slice(1)));
    return { total:list.length, win:w.length, avg_sum_20: sums.length?Math.round(sums.reduce((a,b)=>a+b,0)/sums.length):0,
      hot_red:hotR, hot_red_freq:fR[hotR], hot_blue:hotB, hot_blue_freq:fB[hotB],
      max_miss:Math.max(...mR.slice(1),...mB.slice(1)), latest:list[0]||null };
  },
  async history(win){
    if(state.online) return apiFetch(`/api/history?win=${win}&limit=200`);
    const list=windowOf(loadLocal(),win);
    return { total:loadLocal().length, win:list.length, rows:list.map(r=>({period:r.period,red:r.red,blue:r.blue,sum:sumOf(r),odd:`${oddCount(r)}:${6-oddCount(r)}`,big:`${bigCount(r)}:${6-bigCount(r)}`,demo:r.demo})) };
  },
  async importText(text){
    if(state.online){ const j=await apiFetch("/api/import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text})}); return j; }
    const parsed=parseRaw(text.split(/\r?\n/));
    if(!parsed.length) return {ok:false,msg:"未解析到有效数据：每行格式为「期号 红1…红6 蓝」。"};
    const cur=loadLocal(); const map=new Map(cur.map(d=>[d.period,d]));
    let dup=0; parsed.forEach(d=>{ if(map.has(d.period)) dup++; else map.set(d.period,{...d,demo:false}); });
    const merged=[...map.values()].sort((a,b)=>String(b.period).localeCompare(String(a.period)));
    saveLocal(merged);
    return {ok:true,added:parsed.length-dup,total:merged.length,msg:`导入成功 ${parsed.length-dup} 条，当前共 ${merged.length} 期。`};
  },
  async reset(){
    if(state.online) return apiFetch("/api/reset",{method:"POST"});
    saveLocal(parseRaw(DEMO_RAW).map(r=>({...r,demo:true})));
    return {ok:true,msg:"已重置为内置演示数据。"};
  },
  async clear(){
    if(state.online) return apiFetch("/api/clear",{method:"POST"});
    saveLocal([]);
    return {ok:true,msg:"已清空全部开奖数据。"};
  },
  async stats(win){
    if(state.online) return apiFetch(`/api/stats?win=${win}`);
    const w=windowOf(loadLocal(),win);
    return { win:w.length, freq_red:freqOf(w,RED_MAX).slice(1), freq_blue:freqOf(w,BLUE_MAX,true).slice(1),
      miss_red:missOf(w,RED_MAX).slice(1), miss_blue:missOf(w,BLUE_MAX,true).slice(1) };
  },
  async sums(win){
    if(state.online) return apiFetch(`/api/sums?win=${win}`);
    const w=windowOf(loadLocal(),win);
    const rev=[...w].reverse();
    const series=rev.map(r=>({period:r.period,sum:sumOf(r)}));
    const avg=series.length?Math.round(series.reduce((a,b)=>a+b.sum,0)/series.length):0;
    return {win:w.length,avg,series};
  },
  async recommend(strategy, count, win){
    if(state.online) return apiFetch("/api/recommend",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({strategy,count,win})});
    return {sets:localRecommend(loadLocal(),win,strategy,count),strategy};
  },
  async addPick(strategy, base_period, sets){
    if(state.online) return apiFetch("/api/picks",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({strategy,base_period,sets})});
    const list=loadPicksLocal();
    const pick={id:localId(),strategy,base_period,sets,checked:null,created_at:new Date().toLocaleString("zh-CN",{hour12:false})};
    list.unshift(pick); savePicksLocal(list);
    return {ok:true,id:pick.id};
  },
  async listPicks(){
    if(state.online) return (await apiFetch("/api/picks")).picks;
    return loadPicksLocal();
  },
  async deletePick(id){
    if(state.online) return apiFetch(`/api/picks/${id}`,{method:"DELETE"});
    savePicksLocal(loadPicksLocal().filter(p=>p.id!==id));
    return {ok:true};
  },
  async checkPicks(){
    if(state.online) return apiFetch("/api/picks/check",{method:"POST"});
    const list=loadLocal(), picks=loadPicksLocal();
    let checked=0;
    for(const p of picks){
      if(p.checked) continue;
      const draw=localFindDrawAfter(list,p.base_period);
      if(!draw) continue;
      p.checked={draw_period:draw.period,draw,results:p.sets.map(s=>localCheckOne(s.red,s.blue,draw.red,draw.blue))};
      checked++;
    }
    savePicksLocal(picks);
    return {ok:true,checked,summary:picks.filter(p=>p.checked&&p.checked.won!==undefined).map(p=>({id:p.id,draw_period:p.checked.draw_period, won:p.checked.results.some(r=>r.won)}))};
  },
  async syncStatus(){
    if(!state.online) return {auto:false, online:false, last_sync:"离线模式", last_sync_period:"", last_sync_date:"", source:"", total:0, real_total:0};
    return apiFetch("/api/sync/status");
  },
  async syncNow(){
    if(!state.online) throw new Error("离线模式不支持网络同步，请连接后端服务");
    return apiFetch("/api/sync",{method:"POST"});
  },
  async pairs(win){
    if(!state.online) return {top:[]};
    return apiFetch(`/api/pairs?win=${win||""}`);
  },
  async wheel(reds, blue){
    if(!state.online) throw new Error("离线模式不支持胆拖缩水，请连接后端服务");
    return apiFetch("/api/wheel",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({reds,blue})});
  }
};

}

async function loadStat(){

  const cell = (f, m, isBlue) => {

    let h = "";
    for(let i=0;i<f.length;i++){
      const fv=f[i], mv=m[i], fw=fv/maxF;
      const fc = isBlue?`rgba(62,139,255,${0.15+0.55*fw})`:`rgba(229,72,77,${0.15+0.55*fw})`;
      h += `<div class="freq-cell bar"><div class="n">${String(i+1).padStart(2,"0")}</div><div class="c">${fv}次/漏${mv}</div><div class="bar-bg" style="background:${fc};width:${Math.max(12,fw*100)}%"></div></div>`;
    }
    return h;
  };
  $("#freqRed").innerHTML = cell(st.freq_red, st.miss_red, false);
  $("#freqBlue").innerHTML = cell(st.freq_blue, st.miss_blue, true);
  const h = await dataLayer.history(state.win);
  const dist = arr => { const d={}; arr.forEach(x=>d[x]=(d[x]||0)+1); return Object.entries(d).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<span class="pill warm" style="margin:0 6px 6px 0">${k} 比 ×${v}</span>`).join(""); };
  $("#oddDist").innerHTML = dist(h.rows.map(r=>r.odd));
  $("#bigDist").innerHTML = dist(h.rows.map(r=>r.big));
}
</script>
<script>

let lastGen = [];

function renderPicks(picks){

  if(!picks.length){ box.innerHTML = `<p class="muted">还没有保存过推荐。生成号码后点「保存这批推荐」，开奖导入后点「核对中奖」。</p>`; return; }

async function doGenerate(){

/* =====================================================
   事件绑定 / 路由 / 初始化

function bindEvents(){
  $$("#winSeg button").forEach(b=>b.addEventListener("click",()=>{ state.win=Number(b.dataset.w); render(); }));
  const impText=$("#impText");
  $("#btnImport")?.addEventListener("click",async()=>{
    const r = await dataLayer.importText(impText.value);
    const m=$("#impMsg"); m.className = r.ok?"import-ok":"import-err"; m.textContent = r.msg;

  });
  $("#btnFile")?.addEventListener("click",()=>$("#fileInput").click());
  $("#fileInput")?.addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=async()=>{
      const r=await dataLayer.importText(String(rd.result));
      const m=$("#impMsg"); m.className=r.ok?"import-ok":"import-err"; m.textContent=r.msg;
      if(r.ok) loadData();
    };
    rd.readAsText(f,"utf-8"); e.target.value="";
  });
  $("#btnReset")?.addEventListener("click",async()=>{ await dataLayer.reset(); toast("已重置为内置演示数据"); render(); });
  $("#btnClear")?.addEventListener("click",async()=>{ await dataLayer.clear(); toast("已清空开奖数据"); render(); });
  $("#btnSync")?.addEventListener("click",async()=>{
    const btn=$("#btnSync"), msg=$("#syncMsg");
    btn.disabled=true; btn.textContent="同步中…";
    try{
      const r = await dataLayer.syncNow();
      msg.className = r.ok ? "import-ok" : "import-err";
      msg.textContent = r.ok
        ? `同步完成：新增 ${r.added} 期，最新期 ${r.latest_period}（${r.latest_date||"—"}）${r.history_loaded ? "，已拉取历史开奖数据" : ""}；本次自动核对推荐 ${r.checked} 条。`
        : (r.msg || "同步失败");
      loadData();
    }catch(e){ msg.className="import-err"; msg.textContent = "同步失败：" + e.message; }
    btn.disabled=false; btn.textContent="立即从网络更新";
  });
  $$(".strategy-card").forEach(c=>c.addEventListener("click",()=>{ state.strategy=c.dataset.str; $$(".strategy-card").forEach(x=>x.classList.toggle("selected",x===c)); }));
  $$("#countSeg button").forEach(b=>b.addEventListener("click",()=>{ state.count=Number(b.dataset.c); $$("#countSeg button").forEach(x=>x.classList.toggle("active",x===b)); }));
  $("#btnGen")?.addEventListener("click",doGenerate);
  $("#btnSave")?.addEventListener("click",doSave);
  $("#btnCheck")?.addEventListener("click",doCheck);
  // ---- 胆拖缩水 ----
  wheelState = { reds:new Set(), blue:null };
  renderWheelGrids();
  $("#btnWheel")?.addEventListener("click",doWheel);
  $("#btnWheelClear")?.addEventListener("click",()=>{ wheelState={reds:new Set(),blue:null}; renderWheelGrids(); $("#wheelResult").innerHTML=""; });
}
let wheelState = { reds:new Set(), blue:null };
function renderWheelGrids(){
  const rp=$("#wheelPicks"), rg=$("#wheelRedGrid"), bg=$("#wheelBlueGrid");
  if(!rp||!rg||!bg) return;
  rp.textContent = `${wheelState.reds.size} / 8~12`;
  rg.innerHTML = Array.from({length:33},(_,i)=>i+1).map(n=>`<div class="freq-cell" data-wred="${n}" style="cursor:pointer;${wheelState.reds.has(n)?"border-color:var(--red);color:var(--red);background:rgba(240,80,90,.12)":""}"><b>${String(n).padStart(2,"0")}</b></div>`).join("");
  bg.innerHTML = Array.from({length:16},(_,i)=>i+1).map(n=>`<div class="freq-cell" data-wblue="${n}" style="cursor:pointer;${wheelState.blue===n?"border-color:var(--blue);color:var(--blue);background:rgba(62,139,255,.12)":""}"><b>${String(n).padStart(2,"0")}</b></div>`).join("");
  $$("#wheelRedGrid [data-wred]").forEach(c=>c.addEventListener("click",()=>{ const n=Number(c.dataset.wred); wheelState.reds.has(n)?wheelState.reds.delete(n):wheelState.reds.add(n); renderWheelGrids(); }));
  $$("#wheelBlueGrid [data-wblue]").forEach(c=>c.addEventListener("click",()=>{ wheelState.blue=Number(c.dataset.wblue); renderWheelGrids(); }));
}
async function doWheel(){
  const box=$("#wheelResult");
  if(wheelState.reds.size<8||wheelState.reds.size>12){ box.innerHTML=`<p class="import-err">请先点选 8~12 个红球（当前已选 ${wheelState.reds.size} 个）。</p>`; return; }
  if(!wheelState.blue){ box.innerHTML=`<p class="import-err">请再点选 1 个蓝球。</p>`; return; }
  box.innerHTML=`<p class="muted">生成中…</p>`;
  try{
    const r=await dataLayer.wheel([...wheelState.reds].sort((a,b)=>a-b), wheelState.blue);
    if(!r.ok){ box.innerHTML=`<p class="import-err">${esc(r.msg||"生成失败")}</p>`; return; }
    box.innerHTML = `<div class="import-ok" style="margin-bottom:10px">${esc(r.note)}</div>`
      + r.sets.map((s,i)=>`<div class="check-row"><b class="muted" style="font-family:var(--font-mono)">${String(i+1).padStart(2,"0")}</b>${ballsHTML(s.red,s.blue,true)}</div>`).join("")
      + `<div class="row" style="margin-top:12px"><button class="btn blue" id="btnWheelSave">保存这批胆拖</button><span class="muted">保存后将自动参与每日中奖核对</span></div>`;
    $$("#btnWheelSave").forEach(b=>b.addEventListener("click",async()=>{
      const ov = await dataLayer.overview(state.win);
      const base = ov.latest ? ov.latest.period : "";
      const rr = await dataLayer.addPick("wheel", base, r.sets);
      toast("已保存胆拖（基准期 " + (base||"—") + "）");
      renderPicks(await dataLayer.listPicks());
    }));
  }catch(e){ box.innerHTML=`<p class="import-err">${esc(e.message)}</p>`; }
}
const VIEWS = { home:viewHome, data:viewData, stat:viewStat, chart:viewChart, pick:viewPick };
const LOADERS = { home:loadHome, data:loadData, stat:loadStat, chart:loadChart, pick:loadPick };
async function render(){
  const hash = location.hash.replace("#/","") || "home";
  const view = VIEWS[hash] ? hash : "home";

  $("#main").innerHTML = VIEWS[view]();

function toast(msg){
  let el=$("#toast");
  if(!el){ el=document.createElement("div"); el.id="toast"; el.style.cssText="position:fixed;left:50%;bottom:36px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;box-shadow:0 8px 28px rgba(0,0,0,.4);max-width:88vw"; document.body.appendChild(el); }
  el.textContent=msg; el.style.opacity="1";
  clearTimeout(el._t); el._t=setTimeout(()=>{ el.style.opacity="0"; },3000);
}
function loadECharts(){
  if(window.echarts) return;
  // 优先加载本地 echarts.min.js（随应用部署，NAS 内网无外网依赖）
  const local = document.createElement("script");
  local.src = "echarts.min.js";
  local.onload = () => { render(); };
  local.onerror = () => {
    // 回退：外部 CDN（jsDelivr → cdnjs）
    const urls = [
      "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"
    ];
    (function tryLoad(i){
      if(i>=urls.length || window.echarts) return;
      const sc=document.createElement("script");
      sc.src=urls[i];
      sc.onload=()=>{ render(); };
      sc.onerror=()=>{ tryLoad(i+1); };
      document.head.appendChild(sc);
    })(0);
  };
  document.head.appendChild(local);
}
async function boot(){
  try{ const r=await fetch("/api/overview"); if(r.ok){ state.online=true; } else state.online=false; }
  catch(e){ state.online=false; }
  window.addEventListener("hashchange", render);
  // 窗口尺寸变化时，让图表跟随容器重新适配（铺满屏幕场景）
  window.addEventListener("resize", ()=>{
    if(!window.echarts) return;
    document.querySelectorAll("div[id]").forEach(el=>{
      const c = window.echarts.getInstanceByDom(el);
      if(c) c.resize();
    });
  });
  await render();
  loadECharts();
}
boot();
</script>
</body>
</html>
